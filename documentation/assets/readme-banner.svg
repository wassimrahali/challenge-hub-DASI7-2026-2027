<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Microservices project banner</title>
  <desc id="desc">A blue and violet gradient banner with connected service nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#background)"/>
  <rect width="1200" height="260" rx="22" fill="url(#grid)"/>
  <circle cx="1040" cy="110" r="230" fill="url(#glow)"/>
  <path d="M 0 248 H 1200" stroke="url(#accent)" stroke-width="6"/>

  <text x="66" y="73" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">ACADEMIC PROJECT</text>
  <text x="66" y="132" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">Design. Build. Connect.</text>
  <text x="68" y="174" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">A shared workspace for a distributed application</text>
  <rect x="68" y="199" width="142" height="5" rx="2.5" fill="url(#accent)"/>

  <g fill="none" stroke="#a5b4fc" stroke-opacity="0.58" stroke-width="2.5">
    <path d="M 885 128 L 980 70 L 1080 124 L 995 192 Z"/>
    <path d="M 885 128 L 1080 124"/>
    <path d="M 980 70 L 995 192"/>
  </g>
  <g>
    <circle cx="885" cy="128" r="27" fill="#0891b2" stroke="#67e8f9" stroke-width="4"/>
    <circle cx="980" cy="70" r="24" fill="#4338ca" stroke="#a5b4fc" stroke-width="4"/>
    <circle cx="1080" cy="124" r="30" fill="#7c3aed" stroke="#c4b5fd" stroke-width="4"/>
    <circle cx="995" cy="192" r="24" fill="#0d9488" stroke="#5eead4" stroke-width="4"/>
    <circle cx="885" cy="128" r="6" fill="#ffffff"/>
    <circle cx="980" cy="70" r="6" fill="#ffffff"/>
    <circle cx="1080" cy="124" r="6" fill="#ffffff"/>
    <circle cx="995" cy="192" r="6" fill="#ffffff"/>
  </g>
</svg>
