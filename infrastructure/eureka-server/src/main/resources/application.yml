server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # Disabled for development so unavailable instances are removed quickly.
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
